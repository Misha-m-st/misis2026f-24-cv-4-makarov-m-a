# CLI → этот конфиг → встроенные значения. Пути здесь относительно этого файла.
paths:
  archives: data/archives
  raw: data/raw
  samples: data/samples
  videos: data/videos
  prepared: data/prepared
  weights: weights
  results: results
  cutie: external/Cutie
  external_models: .cache/external
model: finetuned  # baseline — исходные веса, finetuned — опубликованная адаптация
benchmark:
  selected: [efficienttam, livos, sam31]
  seed: 42
  resolution: cutie  # Только benchmark: размер и пропорции CUTIE; native — штатные размеры
  manifest: null
  split_dir: null
  models:
    baseline: {weights: null, inference: {}}
    finetuned:
      weights: results/training-v2/official/documents_main_training_last.pth
      inference: {}
    efficienttam:
      weights: weights/efficienttam/efficienttam_s.pt
      amp: true
      dtype: bfloat16
      compile: true  # VOS predictor + torch.compile всех компонентов
      offload_video_to_cpu: true
      offload_state_to_cpu: false
    livos:
      weights: weights/livos/livos-wmose-480p.pth
      max_internal_size: 480
      amp: false
    sam31:
      weights: weights/sam31/sam3.1_multiplex.pt
      amp: true
      dtype: bfloat16
      compile: false
      use_fa3: false
      offload_video_to_cpu: true
      offload_state_to_cpu: false
samples:
  dataset: smartdoc2015
  count: 1  # максимум 2 фиксированных валидационных примера на датасет
  catalog: null  # null: каталог из пакета; путь — локальный проверяемый каталог
# roots: необязательные пути уже нормализованных данных; исходные локальные папки не перемещаются.
datasets:
  selected:
  - smartdoc2015
  - midv2020
  - midv500
  - midv2019
  - midvholo
  - dlc2021
  roots: {}
# Случайные разбиения применяются только к выбранным поднаборам; полный набор использует recipe.json.
preparation:
  seed: 42
  val_fraction: 0.2
  seq_length: 8
# Проверенный профиль для GPU с 8 ГБ; train — длительная операция.
training:
  batch_size: 2
  seq_length: 8
  crop_size:
  - 480
  - 480
  amp: true
  learning_rate: 1.0e-05
  num_iterations: 30000
  num_ref_frames: 3
  lr_schedule: constant
# Изменение этих значений допускается в infer, но блокирует reproduce. PNG остаются исходного размера.
inference:
  amp: true
  flip_aug: false
  max_internal_size: 480
  use_long_term: true
  mem_every: 5
  max_mem_frames: 5
  top_k: 30
  stagger_updates: 5
  chunk_size: -1
  save_aux: false
  long_term:
    count_usage: true
    max_mem_frames: 10
    min_mem_frames: 5
    num_prototypes: 128
    max_num_tokens: 10000
    buffer_tokens: 2000
# fps применяется только при отсутствии исходных timestamps, alpha — прозрачность маски.
visualization:
  fps: 30.0
  alpha: 0.35
sam:
  weights: weights/sam3/sam3.pt
  prompt: sheet of paper
  min_score: 0.5
  max_masks: 1
  step: null
# Ресурсы исполнения. Они не меняют научный рецепт. min_free_bytes — резерв диска.
runtime:
  cpu_profile: p6-smt12
  workers: 6
  io_threads: 4
  queue_size: 8
  threads_per_worker: 1
  dataloader_workers: 6
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: false
  device: cuda
  min_free_bytes: 0
# SAM3 необязателен. step: null размечает только первый кадр; число — разреженную сетку.
