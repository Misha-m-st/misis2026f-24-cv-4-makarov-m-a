[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "document-vos"
version = "0.1.0"
description = "Воспроизводимая адаптация Cutie к видео документов"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av==16.1.0", "numpy>=1.26,<3", "Pillow>=10,<13", "PyYAML>=6,<7",
  "scipy>=1.11,<2", "matplotlib>=3.8,<4", "hydra-core==1.3.2",
  "torch==2.14.1", "torchvision==0.29.1", "einops>=0.6,<1",
  "opencv-python-headless>=4.8,<5", "tensorboard>=2.11,<3",
  "GitPython>=3.1,<4", "hickle>=5,<6", "tqdm>=4.66,<5",
  "pycocotools>=2.0.7,<3", "thinplate @ git+https://github.com/cheind/py-thin-plate-spline@f6995795397118b7d0ac01aecd3f39ffbfad9dee",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
sam = [
  "sam3 @ git+https://github.com/facebookresearch/sam3@0570b3a5be9c4e694f23d85232fb55f4a6f1f7fc",
  "timm==1.0.22", "huggingface-hub==0.36.0", "iopath==0.1.10",
  "setuptools==80.9.0", "decord==0.6.0", "psutil==7.1.2",
  "opencv-python-headless==4.11.0.86",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[project.scripts]
document-vos = "document_vos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/document_vos"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["official: загрузка синтетических данных официальным Cutie (без весов/GPU)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


[tool.hatch.build.targets.sdist]
only-include = ["src/document_vos", "tests", "docs", "README.md", "config.yaml", "pyproject.toml", "uv.lock", ".python-version"]
