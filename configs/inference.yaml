cutie_root: ../external/Cutie
weights: ../weights/cutie-base-mega.pth
manifest: ../data/split-v1/validation.jsonl
input_dir: null  # Папка phone-testset; при выборе через YAML задайте scope: independent.
split_dir: ../data/split-v1
output: ../results/baseline-v1
scope: validation
device: cuda
seed: 42
inference:
  amp: true
  flip_aug: false
  max_internal_size: -1
  use_long_term: true
  mem_every: 5
  max_mem_frames: 5
  top_k: 30
  stagger_updates: 5
  chunk_size: -1
  long_term:
    count_usage: true
    max_mem_frames: 10
    min_mem_frames: 5
    num_prototypes: 128
    max_num_tokens: 10000
    buffer_tokens: 2000
