cutie_root: ../external/Cutie
weights: ../weights/cutie-base-mega.pth
export: ../data/training-v1
output: ../results/training-v1
seed: 42
workers: 4  # CPU-загрузчики данных; GPU-обучение остаётся одним процессом.
training:
  batch_size: 2
  seq_length: 8
  crop_size: [480, 480]
  amp: true
  learning_rate: 0.00001
  num_iterations: 10000
  num_ref_frames: 3
  lr_schedule: constant
